@media (prefers-color-scheme: light) {
  :root {

    --surface2: #f1f5f9;
    --border: #e2e8f0;
    --text: #0f172a;

* { box-sizing: border-box; margin: 0; padding: 0; }
body {

  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
header {
  padding: 2rem 1.5rem 1.25rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
header h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
header p { color: var(--muted); margin-top: 0.25rem; font-size: 0.85rem; }
.stats {
  display: flex;
  gap: 1.5rem;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  flex-wrap: wrap;
}
.stat { display: flex; flex-direction: column; align-items: center; }
.stat-n { font-size: 1.75rem; font-weight: 700; }
.stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.controls {
  display: flex;
  gap: 0.75rem;
  padding: 0.75rem 1.5rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: center;
}
.controls input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.4rem 0.75rem;
  color: var(--text);
  font-size: 0.85rem;
  width: 220px;
}
.controls input:focus { outline: 2px solid var(--accent); }
.controls select {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.4rem 0.75rem;
  color: var(--text);
  font-size: 0.85rem;
}
.controls label { color: var(--muted); font-size: 0.8rem; }
.wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 900px;
}
thead th {
  background: var(--surface);
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.6rem 0.75rem;
  text-align: left;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
thead th:hover { color: var(--accent); }
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:hover { background: var(--surface2); }
tbody td { padding: 0.55rem 0.75rem; vertical-align: middle; }
.cat-badge {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.cat-liquid_handler { background: #1e3a5f; color: #60a5fa; }
.cat-reader        { background: #1f2d3d; color: #38bdf8; }
.cat-shaker        { background: #1e3a2f; color: #4ade80; }
.cat-storage       { background: #2d1e3a; color: #c084fc; }

.cat-centrifuge    { background: #3a2a1e; color: #fb923c; }
.cat-dispensing    { background: #1e3027; color: #34d399; }
.cat-sealer        { background: #2a1e3a; color: #a78bfa; }
.cat-arm           { background: #1e2a3a; color: #93c5fd; }
.cat-thermal       { background: #3a1e2e; color: #f9a8d4; }
.cat-imaging       { background: #1e3a38; color: #2dd4bf; }
.cat-utility       { background: #292929; color: #d1d5db; }
.machine-name { font-weight: 600; font-size: 0.85rem; }
.manufacturer { color: var(--muted); font-size: 0.78rem; }
a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 0.75rem; }
a:hover { text-decoration: underline; }
.tick { color: var(--green); font-size: 1rem; }
.cross { color: var(--red); font-size: 1rem; }
.both { background: rgba(34,197,94,0.1); }
.partial { background: rgba(245,158,11,0.05); }
.none { background: rgba(239,68,68,0.04); }
.paper-title { font-size: 0.78rem; color: var(--text); max-width: 240px; }
.doi { color: var(--muted); font-size: 0.7rem; font-family: var(--mono); display: block; margin-top: 0.15rem; }
.hidden { display: none; }
footer { padding: 1.5rem; color: var(--muted); font-size: 0.78rem; text-align: center; border-top: 1px solid var(--border); }
</style>

function badge(cat) {
  return `<span class="cat-badge cat-${cat}">${cat.replace(/_/g," ")}</span>`;
}
function tick(v) { return v ? '<span class="tick">✓</span>' : '<span class="cross">✗</span>'; }
function rowClass(d) {
  if (d.has_paper && d.has_code) return "both";
  if (d.has_paper || d.has_code) return "partial";
  return "none";
}
function codeLink(d) {
  if (!d.code) return "—";
  if (d.code.startsWith("(")) return `<span style="color:var(--muted);font-size:0.75rem">${d.code}</span>`;
  return `<a href="https://${d.code}" target="_blank" rel="noopener">${d.code}</a>`;
}
function doiLink(d) {
  if (!d.doi) return "—";
  const url = d.doi.startsWith("10.") ? `https://doi.org/${d.doi}` : `https://arxiv.org/abs/${d.doi}`;
  return `<a href="${url}" target="_blank" rel="noopener">${d.doi}</a>`;
}

let sortCol = -1, sortAsc = true;
function renderTable(rows) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = rows.map(d => `
    <tr class="${rowClass(d)}" data-cat="${d.cat}" data-cov="${rowClass(d)}">
      <td><div class="machine-name">${d.machine}</div></td>
      <td class="manufacturer">${d.mfr}</td>
      <td>${badge(d.cat)}</td>
      <td class="paper-title">${d.paper}</td>
      <td>${doiLink(d)}</td>
      <td>${codeLink(d)}</td>
      <td>${tick(d.has_paper)}</td>
      <td>${tick(d.has_code)}</td>
    </tr>`).join("");
}

function updateStats(rows) {
  const n = rows.length;
  const p = rows.filter(r=>r.has_paper).length;
  const c = rows.filter(r=>r.has_code).length;
  const b = rows.filter(r=>r.has_paper&&r.has_code).length;
  document.getElementById("s-total").textContent = n;
  document.getElementById("s-paper").textContent = p;
  document.getElementById("s-code").textContent = c;
  document.getElementById("s-both").textContent = b;
  document.getElementById("s-pct").textContent = Math.round(b/n*100)+"%";
  document.getElementById("footer").textContent =
    `${n} machines · ${b} with both paper + code (${Math.round(b/n*100)}% coverage) · data from Google Scholar + GitHub, 2026-10-04`;
}

function filter() {
  const q = document.getElementById("search").value.toLowerCase();
  const cat = document.getElementById("cat-filter").value;
  const cov = document.getElementById("cov-filter").value;
  let rows = DATA.filter(d => {
    if (cat && d.cat !== cat) return false;
    if (cov === "both" && rowClass(d) !== "both") return false;
    if (cov === "partial" && rowClass(d) !== "partial") return false;
    if (cov === "none" && rowClass(d) !== "none") return false;
    if (!q) return true;
    return (d.machine+d.mfr+d.paper+d.doi+d.code).toLowerCase().includes(q);
  });
  renderTable(rows);
  updateStats(rows);
}

function sortBy(col) {
  const keys = ["machine","mfr","cat","paper","doi","code","has_paper","has_code"];
  sortAsc = (sortCol === col) ? !sortAsc : true;
  sortCol = col;
  DATA.sort((a,b) => {
    const va = String(a[keys[col]]), vb = String(b[keys[col]]);
    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  filter();
}

document.getElementById("search").addEventListener("input", filter);
document.getElementById("cat-filter").addEventListener("change", filter);
document.getElementById("cov-filter").addEventListener("change", filter);
filter();
</script>
</body>
</html>
