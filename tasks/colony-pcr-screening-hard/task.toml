schema_version = "1.4"

[task]
name = "text2wetlab/colony-pcr-screening-hard"
version = "0.1.0"
description = "Colony PCR screening of 96 colonies on the OT-2, following the Slowpoke paper's OT-2 workflow adapted to the given reagents"
authors = [{ name = "Text2WetLab" }]
keywords = ["opentrons", "ot-2", "lab-automation", "protocol-generation"]

[metadata]
level = "hard"
steps = 4
containers = 4
source = "handwritten"
deck = "specified"
grading = "simulator gate + end-state checks + Sonnet 5.5 rubric judge (75% core: robot practice, tips/contamination, fidelity; 25% task-specific)"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 900.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}", OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}", JUDGE_MODEL = "${JUDGE_MODEL:-}" }   # judge: either key

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "openrouter.ai", "registry.npmjs.org"]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0

[checks]
free_wells = []
# The ground truth (from the easy task) is a 20 uL reaction; the paper's OT-2 workflow is 10 uL and the deck gives no
# primer concentration, so the paper does not determine the PCR plate's exact volumes. What it does fix is checked
# instead: every well gets master mix, its primers and its colony, all wells alike, and a reaction no smaller than the
# paper's OT-2 one (9 uL mix + 1 uL colony = 10 uL) nor larger than a standard Q5 reaction (25 uL). The rubric judges the rest.
not_from_paper = { pcr_plate = [10, 25] }

[[metadata.papers]]
slug = "slowpoke"
experiment = "exp5"
relation = "paper-only variant of colony-pcr-screening; base task: inspired by (handwritten, numbers differ from the script)"

[[metadata.papers]]
slug = "apex"
experiment = "apex-p5"
relation = "paper-only variant of colony-pcr-screening; base task: candidate real reference (APEX protocol 5, colony PCR sample prep); AGPL-3.0, cannot be vendored"
