schema_version = "1.4"

[task]
name = "text2wetlab/colony-pcr-screening-hard"
version = "0.1.0"
description = "Colony PCR screening of 96 colonies on the OT-2, following the Slowpoke paper's OT-2 workflow adapted to the given reagents"
authors = [{ name = "Text2WetLab" }]
keywords = ["opentrons", "ot-2", "lab-automation", "protocol-generation"]

[metadata]
level = "hard"
source = "handwritten"
deck = "specified"
grading = "simulator gate + Sonnet 5.5 rubric judge on the run log"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 900.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}" }

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "registry.npmjs.org"]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
