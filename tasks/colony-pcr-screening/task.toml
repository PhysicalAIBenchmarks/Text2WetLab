schema_version = "1.4"

[task]
name = "text2wetlab/colony-pcr-screening"
version = "0.1.0"
description = "Colony PCR screening with Q5 Hot Start master mix"
authors = [{ name = "Text2WetLab" }]
keywords = ["opentrons", "ot-2", "lab-automation", "protocol-generation"]

[metadata]
source = "handwritten"
deck = "specified"
grading = "simulator + deterministic end-state checker (no LLM judge)"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 900.0

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "registry.npmjs.org"]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
