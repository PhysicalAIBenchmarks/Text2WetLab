schema_version = "1.4"

[task]
name = "text2wetlab/ecoli-heat-shock-transformation-hard"
version = "0.1.0"
description = "APEX Protocol 1 (bioRxiv 2024): low-volume heat shock transformation of 8 plasmids on the OT-2 thermocycler, worked out from the paper"
authors = [{ name = "Text2WetLab" }]
keywords = ["opentrons", "ot-2", "lab-automation", "protocol-generation"]

[metadata]
level = "hard"
steps = 4
containers = 3
source = "paper (doi:10.1101/2024.08.13.607171, fetched at build time)"
deck = "specified"
grading = "simulator gate + end-state checks + Sonnet 5.5 rubric judge (75% core: robot practice, tips/contamination, fidelity; 25% task-specific)"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 900.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}", OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}", JUDGE_MODEL = "${JUDGE_MODEL:-}" }   # judge: either key

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "openrouter.ai", "registry.npmjs.org"]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0

[checks]
free_wells = []

[[metadata.papers]]
slug = "apex"
experiment = "apex-p1"
relation = "the paper the agent is given (APEX protocol 1, fetched at build time)"
