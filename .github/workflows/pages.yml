name: Deploy GitHub Pages
# The site is assembled by scripts/build_site.py: the pages, only the assets they reference, and a leaderboard
# generated from the latest results/runs/ folder, so the published numbers always match the repo.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - plr_*.html
      - docs/**
      - assets/**
      - results/runs/**
      - manuscript/**
      - scripts/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build _site
        run: python scripts/build_site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
