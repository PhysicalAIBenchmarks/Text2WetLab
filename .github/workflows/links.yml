name: Remote URLs
# Every public address of the project and every repo link pointing at one must return 200 (scripts/check_urls.py).
on:
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_urls.py
