name: Deploy to HuggingFace
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - run: python scripts/deploy_hf.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
