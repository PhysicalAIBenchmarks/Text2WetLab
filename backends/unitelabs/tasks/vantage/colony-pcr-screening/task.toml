schema_version = "1.4"

[task]
name = "text2wetlab-ul/vantage.colony-pcr-screening"
version = "0.1.0"
description = "Colony PCR screening with Q5 Hot Start master mix"
authors = [{ name = "UniteLabs" }]
keywords = ["vantage", "unitelabs-sdk", "lab-automation", "protocol-generation"]

[metadata]
level = "easy"
steps = 4
containers = 4
source = "handwritten"
deck = "specified"
papers = [{ slug = "slowpoke", experiment = "exp5", relation = "inspired by (handwritten, numbers differ from the script)" }, { slug = "apex", experiment = "apex-p5", relation = "candidate real reference (APEX protocol 5, colony PCR sample prep); AGPL-3.0, cannot be vendored" }]
grading = "simulated-vantage gate + end-state checks + Sonnet 5.5 rubric judge (75% core: robot practice, tips/contamination, fidelity; 25% task-specific)"
device = "vantage"
feasible = true

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 1800
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}", OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}", JUDGE_MODEL = "${JUDGE_MODEL:-}", SKIP_JUDGE = "${SKIP_JUDGE:-}" }

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "openrouter.ai", "registry.npmjs.org"]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
