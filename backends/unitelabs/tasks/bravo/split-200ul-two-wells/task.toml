schema_version = "1.4"

[task]
name = "text2wetlab-ul/bravo.split-200ul-two-wells"
version = "0.1.0"
description = "Split 200 µL into two 100 µL wells"
authors = [{ name = "UniteLabs" }]
keywords = ["bravo", "unitelabs-sdk", "lab-automation", "protocol-generation"]

[metadata]
level = "easy"
vagueness = "V1"
steps = 1
containers = 2
source = "handwritten"
deck = "specified"
grading = "simulated-bravo gate + end-state checks + Sonnet 5.5 rubric judge (75% core: robot practice, tips/contamination, fidelity; 25% task-specific)"
device = "bravo"
feasible = true

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 1800
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}", OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}", JUDGE_MODEL = "${JUDGE_MODEL:-}", SKIP_JUDGE = "${SKIP_JUDGE:-}" }

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "openrouter.ai", "registry.npmjs.org"]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
