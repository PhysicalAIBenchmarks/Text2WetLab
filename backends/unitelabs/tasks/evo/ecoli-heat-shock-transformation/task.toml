schema_version = "1.4"

[task]
name = "text2wetlab-ul/evo.ecoli-heat-shock-transformation"
version = "0.1.0"
description = "E. coli heat shock transformation with SOC recovery"
authors = [{ name = "UniteLabs" }]
keywords = ["evo", "unitelabs-sdk", "lab-automation", "protocol-generation"]

[metadata]
level = "easy"
steps = 4
containers = 3
source = "handwritten"
deck = "specified"
papers = [{ slug = "apex", experiment = "apex-p1", relation = "candidate real reference (APEX protocol 1); AGPL-3.0, cannot be vendored; the task itself is handwritten" }]
grading = "simulated-evo gate + end-state checks + Sonnet 5.5 rubric judge (75% core: robot practice, tips/contamination, fidelity; 25% task-specific)"
device = "evo"
feasible = false

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 1800
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}", OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}", JUDGE_MODEL = "${JUDGE_MODEL:-}", SKIP_JUDGE = "${SKIP_JUDGE:-}" }

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "openrouter.ai", "registry.npmjs.org"]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
