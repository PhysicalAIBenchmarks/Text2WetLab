schema_version = "1.4"

[task]
name = "text2wetlab-ul/biomek.ampure-bead-cleanup"
version = "0.1.0"
description = "AMPure XP magnetic bead cleanup of PCR products"
authors = [{ name = "UniteLabs" }]
keywords = ["biomek", "unitelabs-sdk", "lab-automation", "protocol-generation"]

[metadata]
level = "easy"
steps = 13
containers = 6
source = "handwritten"
deck = "specified"
papers = [{ slug = "pioneer-ngs", relation = "claimed source, NOT supported: the repo has no AMPure step (Hamilton, PyLabRobot)" }]
grading = "simulated-biomek gate + end-state checks + Sonnet 5.5 rubric judge (75% core: robot practice, tips/contamination, fidelity; 25% task-specific)"
device = "biomek"
feasible = true

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 1800
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}", OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}", JUDGE_MODEL = "${JUDGE_MODEL:-}", SKIP_JUDGE = "${SKIP_JUDGE:-}" }

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "openrouter.ai", "registry.npmjs.org"]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
